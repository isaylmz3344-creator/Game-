<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐣 Civciv Savaşı</title><style>
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;touch-action:none}html,body{width:100%;height:100%;overflow:hidden;font-family:Arial}#g{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#65c8ff 0 65%,#65b84b 65%)}#h{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;justify-content:space-between;color:#fff;font-weight:bold;text-shadow:2px 2px #000}#i{text-align:right;font-size:15px}#p,.e{position:absolute;width:60px;height:60px;display:grid;place-items:center}#p{font-size:50px;z-index:3}.e{font-size:48px;z-index:2}.s{position:absolute;width:19px;height:19px;border-radius:50%;background:#ffe500;box-shadow:0 0 8px #fff,0 0 18px #ffe500;z-index:4}#m{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#0008;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;z-index:5;white-space:nowrap}#o{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000d;color:#fff;text-align:center}#o h1{font-size:40px;margin-bottom:10px}#o p{font-size:20px;margin-bottom:20px}button{border:0;border-radius:12px;padding:13px 22px;background:#ffd900;font-size:18px;font-weight:bold}.hit{animation:f .15s linear 3}@keyframes f{50%{filter:brightness(3)}}
    </style></head><body><div id="g"><div id="h"><div id="hp">❤️❤️❤️</div><div id="i"><b>by; İkra</b><div id="sc">Skor: 0</div><div id="tm">Süre: 0</div></div></div><div id="p">🐣</div><div id="m">🐣 Civcivi hareket ettir</div><div id="o"><h1>💀 OYUN BİTTİ</h1><p id="f"></p><button onclick="R()">🔄 TEKRAR OYNA</button></div></div><script>
    const g=document.getElementById("g"),p=document.getElementById("p"),hp=document.getElementById("hp"),sc=document.getElementById("sc"),tm=document.getElementById("tm"),o=document.getElementById("o"),f=document.getElementById("f");let x=innerWidth/2-30,y=innerHeight-110,H=3,S=0,T=0,E=[],A=[],run=1,last=performance.now(),st=0,dtm=0,es=45,as=160,delay=1200;
    function P(){x=Math.max(0,Math.min(x,innerWidth-60));y=Math.max(65,Math.min(y,innerHeight-60));p.style.left=x+"px";p.style.top=y+"px"}function M(a,b){if(run){x=a-30;y=b-30;P()}}g.onpointerdown=e=>M(e.clientX,e.clientY);g.onpointermove=e=>(e.pointerType=="touch"||e.buttons)&&M(e.clientX,e.clientY);P();
    function C(){let e=document.createElement("div"),q={el:e,x:Math.random()*(innerWidth-60),y:-70,t:0,d:600+Math.random()*700};e.className="e";e.textContent="🐓";e.style.left=q.x+"px";e.style.top="-70px";g.append(e);E.push(q)}
    function A1(q){let e=document.createElement("div"),X=q.x+30,Y=q.y+35,dx=x+30-X,dy=y+30-Y,d=Math.hypot(dx,dy)||1;e.className="s";e.style.left=X+"px";e.style.top=Y+"px";g.append(e);A.push({el:e,x:X,y:Y,vx:dx/d,vy:dy/d})}
    function D(){if(!run)return;H--;hp.textContent="❤️".repeat(H)+"🖤".repeat(3-H);p.classList.remove("hit");void p.offsetWidth;p.classList.add("hit");if(H<1){run=0;f.textContent=`Skor: ${S} | Süre: ${Math.floor(T)} saniye`;o.style.display="flex"}}
    function R(){E.forEach(q=>q.el.remove());A.forEach(q=>q.el.remove());E=[];A=[];H=3;S=0;T=0;st=0;dtm=0;es=45;as=160;delay=1200;hp.textContent="❤️❤️❤️";sc.textContent="Skor: 0";tm.textContent="Süre: 0";x=innerWidth/2-30;y=innerHeight-110;P();o.style.display="none";run=1;last=performance.now();requestAnimationFrame(L)}
    function hit(a,b,s,c,d,z){return a<c+z&&a+s>c&&b<d+z&&b+s>d}
    function L(t){if(!run)return;let d=Math.min((t-last)/1e3,.05);last=t;T+=d;st+=d*1e3;dtm+=d*1e3;tm.textContent="Süre: "+Math.floor(T);if(st>=delay){st=0;C()}if(dtm>=5000){dtm=0;es+=5;as+=20;delay=Math.max(350,delay-70);E.forEach(q=>q.d=Math.max(250,q.d-40))}
    for(let i=E.length-1;i>=0;i--){let q=E[i];q.y+=es*d;q.t+=d*1e3;q.el.style.left=q.x+"px";q.el.style.top=q.y+"px";if(q.t>=q.d){q.t=0;A1(q)}if(q.y>innerHeight+80){q.el.remove();E.splice(i,1);S++;sc.textContent="Skor: "+S}}
    for(let i=A.length-1;i>=0;i--){let q=A[i];q.x+=q.vx*as*d;q.y+=q.vy*as*d;q.el.style.left=q.x+"px";q.el.style.top=q.y+"px";if(hit(q.x,q.y,19,x,y,60)){q.el.remove();A.splice(i,1);D();continue}if(q.x<-50||q.x>innerWidth+50||q.y<-50||q.y>innerHeight+50){q.el.remove();A.splice(i,1)}}requestAnimationFrame(L)}
    onresize=P;requestAnimationFrame(t=>{last=t;L(t)});
    </script></body></html>
